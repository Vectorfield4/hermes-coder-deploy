services:
  dispatcher:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dispatcher
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
      - ./workspace:/workspace
      - ./scripts/load-secrets.sh:/usr/local/bin/load-secrets.sh:ro
      - ./scripts/ensure-profile.sh:/usr/local/bin/ensure-profile.sh:ro
    secrets:
      - openai_api_key
      - dense_mem_dispatcher
    environment:
      HERMES_PROFILE: dispatcher
      OPENAI_API_BASE: https://api.deepseek.com/v1
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DENSE_MEM_API_KEY_FILE: /run/secrets/dense_mem_dispatcher
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        . /usr/local/bin/load-secrets.sh &&
        /usr/local/bin/ensure-profile.sh dispatcher &&
        hermes kanban work --profile dispatcher --role orchestrator --skill orchestrate-task --loop --interval 5
      "
    healthcheck:
      test: ["CMD", "hermes", "kanban", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  coder:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-coder
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
      - ./workspace:/workspace
      - ./scripts/load-secrets.sh:/usr/local/bin/load-secrets.sh:ro
      - ./scripts/ensure-profile.sh:/usr/local/bin/ensure-profile.sh:ro
    secrets:
      - github_token
      - vercel_token
      - vercel_org_id
      - vercel_project_id
      - openai_api_key
      - dense_mem_coder
    environment:
      HERMES_PROFILE: coder
      OPENAI_API_BASE: https://api.deepseek.com/v1
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      VERCEL_TOKEN_FILE: /run/secrets/vercel_token
      VERCEL_ORG_ID_FILE: /run/secrets/vercel_org_id
      VERCEL_PROJECT_ID_FILE: /run/secrets/vercel_project_id
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DENSE_MEM_API_KEY_FILE: /run/secrets/dense_mem_coder
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        . /usr/local/bin/load-secrets.sh &&
        /usr/local/bin/ensure-profile.sh coder &&
        hermes kanban work --profile coder --role developer --skill execute-task --skip_context_files --loop --interval 5
      "
    healthcheck:
      test: ["CMD", "hermes", "kanban", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  qa:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-qa
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
      - ./workspace:/workspace
      - ./scripts/load-secrets.sh:/usr/local/bin/load-secrets.sh:ro
      - ./scripts/ensure-profile.sh:/usr/local/bin/ensure-profile.sh:ro
    secrets:
      - github_token
      - ftp_host
      - ftp_user
      - ftp_pass
      - vercel_token
      - vercel_org_id
      - vercel_project_id
      - openai_api_key
      - dense_mem_qa
    environment:
      HERMES_PROFILE: qa
      OPENAI_API_BASE: https://api.deepseek.com/v1
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      FTP_HOST_FILE: /run/secrets/ftp_host
      FTP_USER_FILE: /run/secrets/ftp_user
      FTP_PASS_FILE: /run/secrets/ftp_pass
      VERCEL_TOKEN_FILE: /run/secrets/vercel_token
      VERCEL_ORG_ID_FILE: /run/secrets/vercel_org_id
      VERCEL_PROJECT_ID_FILE: /run/secrets/vercel_project_id
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DENSE_MEM_API_KEY_FILE: /run/secrets/dense_mem_qa
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        . /usr/local/bin/load-secrets.sh &&
        /usr/local/bin/ensure-profile.sh qa &&
        hermes kanban work --profile qa --role qa --skill execute-qa-task --loop --interval 5
      "
    healthcheck:
      test: ["CMD", "hermes", "kanban", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram-bot:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-telegram
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
      - ./scripts/load-secrets.sh:/usr/local/bin/load-secrets.sh:ro
      - ./scripts/ensure-profile.sh:/usr/local/bin/ensure-profile.sh:ro
      - ./scripts/notify-blocked.sh:/usr/local/bin/notify-blocked.sh:ro
    secrets:
      - token
      - TELEGRAM_ALLOWED_CHATS
      - openai_api_key
      - dense_mem_dispatcher
    environment:
      HERMES_PROFILE: dispatcher
      OPENAI_API_BASE: https://api.deepseek.com/v1
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/token
      TELEGRAM_ALLOWED_CHATS_FILE: /run/secrets/TELEGRAM_ALLOWED_CHATS
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DENSE_MEM_API_KEY_FILE: /run/secrets/dense_mem_dispatcher
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        . /usr/local/bin/load-secrets.sh &&
        /usr/local/bin/ensure-profile.sh dispatcher &&
        /usr/local/bin/notify-blocked.sh &
        hermes gateway run --profile dispatcher --skill command-handler --gateway telegram
      "
    healthcheck:
      test: ["CMD", "hermes", "gateway", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  memory-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: hermes-memory-db
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: densemem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: densemem
    volumes:
      - memory-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"densemem\" -d \"densemem\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: hermes-embedding
    restart: unless-stopped
    command: >
      --model-id sentence-transformers/all-MiniLM-L6-v2
      --port 8080
      --max-batch-tokens 8192
      --max-client-batch-size 32
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - embedding-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  dense-mem:
    image: ghcr.io/markhuangai/dense-mem:latest
    container_name: hermes-dense-mem
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", ". /usr/local/bin/load-secrets.sh && exec /app/docker-entrypoint.sh \"$@\"", "--"]
    command: ["/app/server"]
    volumes:
      - ./scripts/load-secrets.sh:/usr/local/bin/load-secrets.sh:ro
    secrets:
      - postgres_password
      - control_portal_token
      - ai_verifier_api_key
    environment:
      LOG_LEVEL: info
      CONTROL_HTTP_ADDR: ":8090"
      CONTROL_PORTAL_TOKEN_FILE: /run/secrets/control_portal_token
      POSTGRES_USER: densemem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: densemem
      POSTGRES_HOST: memory-db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: ""
      DISTRIBUTED_COORDINATION_REQUIRED: "false"
      AI_API_URL: http://embedding:8080/v1
      AI_API_KEY: tei
      AI_API_EMBEDDING_MODEL: all-MiniLM-L6-v2
      AI_API_EMBEDDING_DIMENSIONS: "384"
      AI_VERIFIER_API_URL: https://api.deepseek.com/v1
      AI_VERIFIER_API_KEY_FILE: /run/secrets/ai_verifier_api_key
      AI_VERIFIER_MODEL: deepseek-chat
      AI_VERIFIER_MAX_INPUT_TOKENS: "64000"
      AI_VERIFIER_MAX_OUTPUT_TOKENS: "8192"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      memory-db:
        condition: service_healthy
      embedding:
        condition: service_healthy

secrets:
  token: { file: ./secrets/token }
  TELEGRAM_ALLOWED_CHATS: { file: ./secrets/TELEGRAM_ALLOWED_CHATS }
  github_token: { file: ./secrets/github_token }
  vercel_token: { file: ./secrets/vercel_token }
  vercel_org_id: { file: ./secrets/vercel_org_id }
  vercel_project_id: { file: ./secrets/vercel_project_id }
  ftp_host: { file: ./secrets/ftp_host }
  ftp_user: { file: ./secrets/ftp_user }
  ftp_pass: { file: ./secrets/ftp_pass }
  openai_api_key: { file: ./secrets/openai_api_key }
  dense_mem_dispatcher: { file: ./secrets/dense_mem_dispatcher }
  dense_mem_coder: { file: ./secrets/dense_mem_coder }
  dense_mem_qa: { file: ./secrets/dense_mem_qa }
  postgres_password: { file: ./secrets/postgres_password }
  control_portal_token: { file: ./secrets/control_portal_token }
  ai_verifier_api_key: { file: ./secrets/ai_verifier_api_key }

volumes:
  memory-db-data:
  embedding-cache:
