services:
  dispatcher:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dispatcher
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
      - ./workspace:/workspace
    env_file:
      - ./profiles/dispatcher/.env
    environment:
      - HERMES_PROFILE=dispatcher
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        hermes profile install https://github.com/Vectorfield4/hermes-coder-deploy --alias dispatcher &&
        hermes kanban work --profile dispatcher --role orchestrator --skill orchestrate-task --loop --interval 5
      "
    healthcheck:
      test: ["CMD", "hermes", "kanban", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  coder:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-coder
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
      - ./workspace:/workspace
    env_file:
      - ./profiles/coder/.env
    environment:
      - HERMES_PROFILE=coder
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        hermes profile install https://github.com/Vectorfield4/hermes-coder-deploy --alias coder &&
        hermes kanban work --profile coder --role developer --skill execute-task --skip_context_files --loop --interval 5
      "
    healthcheck:
      test: ["CMD", "hermes", "kanban", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  qa:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-qa
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
      - ./workspace:/workspace
    env_file:
      - ./profiles/qa/.env
    environment:
      - HERMES_PROFILE=qa
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        hermes profile install https://github.com/Vectorfield4/hermes-coder-deploy --alias qa &&
        hermes kanban work --profile qa --role qa --skill execute-qa-task --loop --interval 5
      "
    healthcheck:
      test: ["CMD", "hermes", "kanban", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  telegram-bot:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-telegram
    restart: unless-stopped
    volumes:
      - ./hermes-data:/home/hermes/.hermes
    env_file:
      - ./profiles/dispatcher/.env
    environment:
      - HERMES_PROFILE=dispatcher
    depends_on:
      dense-mem:
        condition: service_healthy
    command: >
      sh -c "
        hermes profile install https://github.com/Vectorfield4/hermes-coder-deploy --alias dispatcher &&
        hermes gateway run --profile dispatcher --skill command-handler --gateway telegram
      "
    healthcheck:
      test: ["CMD", "hermes", "gateway", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  memory-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: hermes-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env (make init)}
      POSTGRES_DB: ${POSTGRES_DB:-densemem}
    volumes:
      - memory-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-densemem}\" -d \"${POSTGRES_DB:-densemem}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: hermes-embedding
    restart: unless-stopped
    command: >
      --model-id sentence-transformers/all-MiniLM-L6-v2
      --port 8080
      --max-batch-tokens 8192
      --max-client-batch-size 32
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - embedding-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  dense-mem:
    image: ghcr.io/markhuangai/dense-mem:latest
    container_name: hermes-dense-mem
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_HTTP_ADDR: ":8090"
      CONTROL_PORTAL_TOKEN: ${CONTROL_PORTAL_TOKEN:?CONTROL_PORTAL_TOKEN must be set in the root .env (make init)}
      POSTGRES_USER: ${POSTGRES_USER:-densemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env (make init)}
      POSTGRES_DB: ${POSTGRES_DB:-densemem}
      POSTGRES_HOST: memory-db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: ""
      DISTRIBUTED_COORDINATION_REQUIRED: "false"
      AI_API_URL: ${AI_API_URL:-http://embedding:8080/v1}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in the root .env (make init)}
      AI_API_EMBEDDING_MODEL: ${AI_API_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      AI_API_EMBEDDING_DIMENSIONS: ${AI_API_EMBEDDING_DIMENSIONS:-384}
      AI_VERIFIER_API_URL: ${AI_VERIFIER_API_URL:-https://api.deepseek.com/v1}
      AI_VERIFIER_API_KEY: ${AI_VERIFIER_API_KEY:?AI_VERIFIER_API_KEY must be set in the root .env (make init)}
      AI_VERIFIER_MODEL: ${AI_VERIFIER_MODEL:-deepseek-chat}
      AI_VERIFIER_MAX_INPUT_TOKENS: ${AI_VERIFIER_MAX_INPUT_TOKENS:-64000}
      AI_VERIFIER_MAX_OUTPUT_TOKENS: ${AI_VERIFIER_MAX_OUTPUT_TOKENS:-8192}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      memory-db:
        condition: service_healthy
      embedding:
        condition: service_healthy

volumes:
  memory-db-data:
  embedding-cache:
