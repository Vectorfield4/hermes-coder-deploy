profile: qa
model: deepseek-reasoner
temperature: 0.1
max_tokens: 4096
top_p: 0.85
mcp_servers:
  dense_mem:
    url: "http://dense-mem:8080/mcp"
    headers:
      Authorization: "Bearer ${DENSE_MEM_API_KEY}"
    tools:
      include: [remember, get_submission_status, recall_memory, trace_memory, correct_relationship, retract_evidence]